name: Registry Quality Gate

on:
  pull_request:
    paths:
      - 'packages/*.toml'
      - 'packages/*.toml.sig'
      - 'releases/**'
      - 'releases/**/*.toml'
      - 'releases/**/*.toml.sig'
      - 'scripts/**'
      - '.github/workflows/registry-quality-gate.yml'
  workflow_run:
    workflows:
      - Sign Manifests On Merge
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-pr-manifests:
    name: Detect PR Manifest Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      manifests_json: ${{ steps.changed.outputs.manifests_json }}
      manifest_count: ${{ steps.changed.outputs.manifest_count }}
      release_manifests_json: ${{ steps.changed.outputs.release_manifests_json }}
      release_manifest_count: ${{ steps.changed.outputs.release_manifest_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Collect changed manifests
        id: changed
        env:
          REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          manifests_json="$(
            REGISTRY_BASE_SHA="$REGISTRY_BASE_SHA" ./scripts/registry-changed-manifests.sh \
              | python3 -c 'import json, sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))'
          )"

          manifest_count="$(
            MANIFESTS_JSON="$manifests_json" python3 -c 'import json, os; print(len(json.loads(os.environ["MANIFESTS_JSON"])))'
          )"

          release_manifests_json="$(
            MANIFESTS_JSON="$manifests_json" python3 -c 'import json, os; print(json.dumps([path for path in json.loads(os.environ["MANIFESTS_JSON"]) if path.startswith("releases/")]))'
          )"

          release_manifest_count="$(
            RELEASE_MANIFESTS_JSON="$release_manifests_json" python3 -c 'import json, os; print(len(json.loads(os.environ["RELEASE_MANIFESTS_JSON"])))'
          )"

          {
            echo "manifests_json=$manifests_json"
            echo "manifest_count=$manifest_count"
            echo "release_manifests_json=$release_manifests_json"
            echo "release_manifest_count=$release_manifest_count"
          } >> "$GITHUB_OUTPUT"

  preflight:
    name: Validate Registry Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Registry preflight (PR changed manifests)
        if: github.event_name == 'pull_request'
        env:
          REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REGISTRY_REQUIRE_SIGNATURES: '0'
          REGISTRY_PREFLIGHT_SKIP_SMOKE: '1'
        run: ./scripts/registry-preflight.sh

      - name: Registry preflight (workflow-run changed manifests)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          REGISTRY_BASE_SHA: ${{ github.event.workflow_run.head_sha }}^
        run: ./scripts/registry-preflight.sh

      - name: Registry preflight (full scan)
        if: github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_PREFLIGHT_ALL: '1'
        run: ./scripts/registry-preflight.sh

  pr-smoke:
    name: PR Smoke Install (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    needs:
      - detect-pr-manifests
      - preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke install (changed releases)
        if: needs.detect-pr-manifests.outputs.release_manifest_count != '0'
        shell: bash
        env:
          MANIFESTS_JSON: ${{ needs.detect-pr-manifests.outputs.release_manifests_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          manifests = json.loads(os.environ["MANIFESTS_JSON"])
          if not manifests:
              print("No changed manifests in this PR.")
              raise SystemExit(0)

          cmd = [
              sys.executable,
              "scripts/registry-smoke-install.py",
              "--require-runner-target",
              *manifests,
          ]
          subprocess.run(cmd, check=True)
          PY

      - name: Skip changed-release smoke (none changed)
        if: needs.detect-pr-manifests.outputs.release_manifest_count == '0'
        shell: bash
        run: echo "No changed release manifests in this PR."

      - name: App-bundle smoke canary (macOS)
        if: runner.os == 'macOS'
        run: python3 ./scripts/registry-smoke-install.py --app-bundle-canary

  pr-crosspack-native:
    name: PR Crosspack Native Validation
    if: github.event_name == 'pull_request'
    needs:
      - detect-pr-manifests
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          path: registry
          fetch-depth: 0

      - name: Checkout Crosspack
        uses: actions/checkout@v4
        with:
          repository: spiritledsoftware/crosspack
          submodules: false
          path: crosspack

      - name: Crosspack native validation (changed packages)
        if: needs.detect-pr-manifests.outputs.manifest_count != '0'
        shell: bash
        env:
          MANIFESTS_JSON: ${{ needs.detect-pr-manifests.outputs.manifests_json }}
          CROSSPACK_REPO_ROOT: ${{ github.workspace }}/crosspack
          CROSSPACK_NATIVE_TARGETS: x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
        run: |
          cd registry
          mapfile -t manifests < <(
            MANIFESTS_JSON="$MANIFESTS_JSON" python3 -c 'import json, os; print("\n".join(json.loads(os.environ["MANIFESTS_JSON"])))'
          )
          ./scripts/registry-crosspack-native-check.sh "${manifests[@]}"

      - name: Skip Crosspack native validation (none changed)
        if: needs.detect-pr-manifests.outputs.manifest_count == '0'
        shell: bash
        run: echo "No changed manifests in this PR."
