name = "gh"
license = "MIT"
homepage = "https://github.com/cli/cli"

[source]
provider = "github"
repo = "cli/cli"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "gh_{version}_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "gh_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "gh_{version}_macOS_amd64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "gh_{version}_macOS_arm64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "gh_{version}_windows_amd64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh.exe"
