name = "bat"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/sharkdp/bat"

[source]
provider = "github"
repo = "sharkdp/bat"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "bat-v{version}-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "bat"
path = "bat"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "bat-v{version}-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "bat"
path = "bat"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "bat-v{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "bat"
path = "bat"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "bat-v{version}-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "bat"
path = "bat"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "bat-v{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bat"
path = "bat.exe"
