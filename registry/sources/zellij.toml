name = "zellij"
license = "MIT"
homepage = "https://github.com/zellij-org/zellij"

[source]
provider = "github"
repo = "zellij-org/zellij"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "zellij-x86_64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "zellij-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "zellij-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "zellij-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "zellij-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij.exe"
