name = "yq"
license = "MIT"
homepage = "https://github.com/mikefarah/yq"

[source]
provider = "github"
repo = "mikefarah/yq"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "yq_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "yq"
path = "yq_linux_amd64"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "yq_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "yq"
path = "yq_linux_arm64"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "yq_darwin_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "yq"
path = "yq_darwin_amd64"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "yq_darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "yq"
path = "yq_darwin_arm64"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "yq_windows_amd64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "yq"
path = "yq_windows_amd64.exe"
