name = "dbeaver"
license = "Apache-2.0"
homepage = "https://dbeaver.io/"

[source]
provider = "github"
repo = "dbeaver/dbeaver"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "dbeaver-ce-{version}-linux-x86_64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "dbeaver"
path = "dbeaver/dbeaver"

[[artifacts.gui_apps]]
app_id = "io.dbeaver.DBeaverCommunity"
display_name = "DBeaver Community"
exec = "dbeaver"
categories = ["Development", "Database"]

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "dbeaver-ce-{version}-linux-aarch64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "dbeaver"
path = "dbeaver/dbeaver"

[[artifacts.gui_apps]]
app_id = "io.dbeaver.DBeaverCommunity"
display_name = "DBeaver Community"
exec = "dbeaver"
categories = ["Development", "Database"]

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "dbeaver-ce-{version}-macos-x86_64.dmg"
strip_components = 0

[[artifacts.binaries]]
name = "dbeaver"
path = "DBeaver.app/Contents/MacOS/dbeaver"

[[artifacts.gui_apps]]
app_id = "io.dbeaver.DBeaverCommunity"
display_name = "DBeaver Community"
exec = "DBeaver.app"
categories = ["Development", "Database"]

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "dbeaver-ce-{version}-macos-aarch64.dmg"
strip_components = 0

[[artifacts.binaries]]
name = "dbeaver"
path = "DBeaver.app/Contents/MacOS/dbeaver"

[[artifacts.gui_apps]]
app_id = "io.dbeaver.DBeaverCommunity"
display_name = "DBeaver Community"
exec = "DBeaver.app"
categories = ["Development", "Database"]

[[artifacts]]
