name = "procs"
license = "MIT"
homepage = "https://github.com/dalance/procs"

[source]
provider = "github"
repo = "dalance/procs"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "procs-v{version}-x86_64-linux.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "procs"
path = "procs"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "procs-v{version}-aarch64-linux.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "procs"
path = "procs"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "procs-v{version}-x86_64-mac.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "procs"
path = "procs"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "procs-v{version}-aarch64-mac.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "procs"
path = "procs"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "procs-v{version}-x86_64-windows.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "procs"
path = "procs.exe"
