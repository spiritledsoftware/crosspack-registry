name = "atuin"
license = "MIT"
homepage = "https://github.com/atuinsh/atuin"

[source]
provider = "github"
repo = "atuinsh/atuin"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "atuin-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "atuin"
path = "atuin"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "atuin-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "atuin"
path = "atuin"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "atuin-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "atuin"
path = "atuin"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "atuin-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "atuin"
path = "atuin.exe"
