name = "shfmt"
license = "BSD-3-Clause"
homepage = "https://github.com/mvdan/sh"

[source]
provider = "github"
repo = "mvdan/sh"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "shfmt_v{version}_linux_amd64"
archive = "bin"

[[artifacts.binaries]]
name = "shfmt"
path = "shfmt_v{version}_linux_amd64"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "shfmt_v{version}_linux_arm64"
archive = "bin"

[[artifacts.binaries]]
name = "shfmt"
path = "shfmt_v{version}_linux_arm64"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "shfmt_v{version}_darwin_amd64"
archive = "bin"

[[artifacts.binaries]]
name = "shfmt"
path = "shfmt_v{version}_darwin_amd64"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "shfmt_v{version}_darwin_arm64"
archive = "bin"

[[artifacts.binaries]]
name = "shfmt"
path = "shfmt_v{version}_darwin_arm64"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "shfmt_v{version}_windows_amd64.exe"
archive = "bin"

[[artifacts.binaries]]
name = "shfmt"
path = "shfmt_v{version}_windows_amd64.exe"
