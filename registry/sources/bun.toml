name = "bun"
license = "MIT"
homepage = "https://bun.com/"

[source.release]
kind = "github_releases"
repo = "oven-sh/bun"
tag_prefix = "bun-v"
include_prereleases = false

[source.checksum]
kind = "shasums256"
url_template = "https://github.com/oven-sh/bun/releases/download/bun-v{version}/SHASUMS256.txt"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "bun-linux-x64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bun"
path = "bun"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "bun-linux-aarch64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bun"
path = "bun"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "bun-darwin-x64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bun"
path = "bun"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "bun-darwin-aarch64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bun"
path = "bun"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "bun-windows-x64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bun"
path = "bun.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "bun-windows-aarch64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "bun"
path = "bun.exe"
