name = "starship"
license = "ISC"
homepage = "https://github.com/starship/starship"

[source]
provider = "github"
repo = "starship/starship"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "starship-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "aarch64-unknown-linux-musl"
asset = "starship-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "starship-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "starship-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "starship-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship.exe"
