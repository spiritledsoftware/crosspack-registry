name = "fd"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/sharkdp/fd"

[source.release]
kind = "github_releases"
repo = "sharkdp/fd"
tag_prefix = "v"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "fd-v{version}-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "fd"
path = "fd"

[[artifacts.completions]]
shell = "bash"
path = "autocomplete/fd.bash"

[[artifacts.completions]]
shell = "zsh"
path = "autocomplete/_fd"

[[artifacts.completions]]
shell = "fish"
path = "autocomplete/fd.fish"

[[artifacts.completions]]
shell = "powershell"
path = "autocomplete/fd.ps1"

