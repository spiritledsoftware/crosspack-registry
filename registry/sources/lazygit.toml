name = "lazygit"
license = "MIT"
homepage = "https://github.com/jesseduffield/lazygit"

[source]
provider = "github"
repo = "jesseduffield/lazygit"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "lazygit_{version}_linux_x86_64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "lazygit"
path = "lazygit"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "lazygit_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "lazygit"
path = "lazygit"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "lazygit_{version}_darwin_x86_64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "lazygit"
path = "lazygit"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "lazygit_{version}_darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "lazygit"
path = "lazygit"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "lazygit_{version}_windows_x86_64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "lazygit"
path = "lazygit.exe"
