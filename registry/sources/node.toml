name = "node"
license = "MIT"
homepage = "https://nodejs.org/"

[source.release]
kind = "json_index"
url = "https://nodejs.org/dist/index.json"

[source.version]
kind = "prefixed_semver_field"
field = "version"
prefix = "v"
require_prefix = "v22."

[source.checksum]
kind = "shasums256"
url_template = "https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt"

[source.asset]
kind = "templated"
base_url = "https://nodejs.org/dist/latest-v22.x"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "node-v{version}-linux-x64.tar.xz"
archive = "tar.xz"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "bin/node"

[[artifacts.binaries]]
name = "npm"
path = "bin/npm"

[[artifacts.binaries]]
name = "npx"
path = "bin/npx"

[[artifacts.binaries]]
name = "corepack"
path = "bin/corepack"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "node-v{version}-linux-arm64.tar.xz"
archive = "tar.xz"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "bin/node"

[[artifacts.binaries]]
name = "npm"
path = "bin/npm"

[[artifacts.binaries]]
name = "npx"
path = "bin/npx"

[[artifacts.binaries]]
name = "corepack"
path = "bin/corepack"

[[artifacts]]
