name = "node"
license = "MIT"
homepage = "https://nodejs.org/"

[source]
provider = "nodejs-dist"
major = 22
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "node-v{version}-linux-x64.tar.xz"
archive = "tar.xz"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "bin/node"

[[artifacts.binaries]]
name = "npm"
path = "bin/npm"

[[artifacts.binaries]]
name = "npx"
path = "bin/npx"

[[artifacts.binaries]]
name = "corepack"
path = "bin/corepack"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "node-v{version}-linux-arm64.tar.xz"
archive = "tar.xz"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "bin/node"

[[artifacts.binaries]]
name = "npm"
path = "bin/npm"

[[artifacts.binaries]]
name = "npx"
path = "bin/npx"

[[artifacts.binaries]]
name = "corepack"
path = "bin/corepack"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "node-v{version}-darwin-x64.tar.xz"
archive = "tar.xz"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "bin/node"

[[artifacts.binaries]]
name = "npm"
path = "bin/npm"

[[artifacts.binaries]]
name = "npx"
path = "bin/npx"

[[artifacts.binaries]]
name = "corepack"
path = "bin/corepack"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "node-v{version}-darwin-arm64.tar.xz"
archive = "tar.xz"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "bin/node"

[[artifacts.binaries]]
name = "npm"
path = "bin/npm"

[[artifacts.binaries]]
name = "npx"
path = "bin/npx"

[[artifacts.binaries]]
name = "corepack"
path = "bin/corepack"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "node-v{version}-win-x64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "node"
path = "node.exe"

[[artifacts.binaries]]
name = "npm"
path = "npm.cmd"

[[artifacts.binaries]]
name = "npx"
path = "npx.cmd"

[[artifacts.binaries]]
