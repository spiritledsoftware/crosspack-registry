name = "zellij"
license = "MIT"
homepage = "https://github.com/zellij-org/zellij"

[source.release]
kind = "github_releases"
repo = "zellij-org/zellij"
include_prereleases = false
tag_prefix = "v"

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "zellij-x86_64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "zellij-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "zellij-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "zellij-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "zellij-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "zellij"
path = "zellij.exe"
