name = "cmake"
license = "BSD-3-Clause"
homepage = "https://github.com/Kitware/CMake"

[source.release]
kind = "github_releases"
repo = "Kitware/CMake"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "cmake-{version}-linux-x86_64.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "cmake"
path = "bin/cmake"
[[artifacts.binaries]]
name = "ctest"
path = "bin/ctest"
[[artifacts.binaries]]
name = "cpack"
path = "bin/cpack"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "cmake-{version}-linux-aarch64.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "cmake"
path = "bin/cmake"
[[artifacts.binaries]]
name = "ctest"
path = "bin/ctest"
[[artifacts.binaries]]
name = "cpack"
path = "bin/cpack"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "cmake-{version}-macos-universal.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "cmake"
path = "bin/cmake"
[[artifacts.binaries]]
name = "ctest"
path = "bin/ctest"
[[artifacts.binaries]]
name = "cpack"
path = "bin/cpack"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "cmake-{version}-macos-universal.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "cmake"
path = "bin/cmake"
[[artifacts.binaries]]
name = "ctest"
path = "bin/ctest"
[[artifacts.binaries]]
name = "cpack"
path = "bin/cpack"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "cmake-{version}-windows-x86_64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "cmake"
path = "bin/cmake.exe"
[[artifacts.binaries]]
name = "ctest"
path = "bin/ctest.exe"
[[artifacts.binaries]]
name = "cpack"
path = "bin/cpack.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "cmake-{version}-windows-arm64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "cmake"
path = "bin/cmake.exe"
[[artifacts.binaries]]
name = "ctest"
path = "bin/ctest.exe"
[[artifacts.binaries]]
name = "cpack"
path = "bin/cpack.exe"
