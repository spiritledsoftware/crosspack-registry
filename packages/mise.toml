name = "mise"
license = "MIT"
homepage = "https://github.com/jdx/mise"

[[shell_init]]
name = "mise"
binary = "mise"
strategy = "eval_stdout"
bash = ["activate", "bash"]
zsh = ["activate", "zsh"]
fish = ["activate", "fish"]
powershell = ["activate", "pwsh"]

[source.release]
kind = "github_releases"
repo = "jdx/mise"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "mise-v{version}-linux-x64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "mise"
path = "mise"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "mise-v{version}-linux-arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "mise"
path = "mise"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "mise-v{version}-macos-x64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "mise"
path = "mise"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "mise-v{version}-macos-arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "mise"
path = "mise"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "mise-v{version}-windows-x64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "mise"
path = "mise.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "mise-v{version}-windows-arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "mise"
path = "mise.exe"
