name = "typos"
license = "MIT"
homepage = "https://github.com/crate-ci/typos"

[source.release]
kind = "github_releases"
repo = "crate-ci/typos"
tag_prefix = "v"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-musl"
asset = "typos-v{version}-x86_64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "typos"
path = "typos"

[[artifacts]]
target = "aarch64-unknown-linux-musl"
asset = "typos-v{version}-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "typos"
path = "typos"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "typos-v{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "typos"
path = "typos"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "typos-v{version}-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "typos"
path = "typos"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "typos-v{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "typos"
path = "typos.exe"
