name = "powershell"
license = "MIT"
homepage = "https://github.com/PowerShell/PowerShell"

[source.release]
kind = "github_releases"
repo = "PowerShell/PowerShell"
include_prereleases = false
tag_prefix = "v"

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "powershell-{version}-linux-x64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "pwsh"
path = "pwsh"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "powershell-{version}-linux-arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "pwsh"
path = "pwsh"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "powershell-{version}-osx-x64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "pwsh"
path = "pwsh"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "powershell-{version}-osx-arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "pwsh"
path = "pwsh"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "PowerShell-{version}-win-x64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "pwsh"
path = "pwsh.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "PowerShell-{version}-win-arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "pwsh"
path = "pwsh.exe"
