name = "kubecolor"
license = "MIT"
homepage = "https://github.com/kubecolor/kubecolor"

[[integrations]]
kind = "path_plugin"
host = "kubectl"
name = "color"
source = "kubecolor"

[source.release]
kind = "github_releases"
repo = "kubecolor/kubecolor"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "kubecolor_{version}_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "kubecolor"
path = "kubecolor"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "kubecolor_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "kubecolor"
path = "kubecolor"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "kubecolor_{version}_darwin_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "kubecolor"
path = "kubecolor"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "kubecolor_{version}_darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "kubecolor"
path = "kubecolor"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "kubecolor_{version}_windows_amd64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "kubecolor"
path = "kubecolor.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "kubecolor_{version}_windows_arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "kubecolor"
path = "kubecolor.exe"
