name = "oras"
license = "Apache-2.0"
homepage = "https://github.com/oras-project/oras"

[source.release]
kind = "github_releases"
repo = "oras-project/oras"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "oras_{version}_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "oras"
path = "oras"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "oras_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "oras"
path = "oras"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "oras_{version}_darwin_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "oras"
path = "oras"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "oras_{version}_darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "oras"
path = "oras"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "oras_{version}_windows_amd64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "oras"
path = "oras.exe"
