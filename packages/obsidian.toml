name = "obsidian"
license = "Proprietary"
homepage = "https://github.com/obsidianmd/obsidian-releases"

[source.release]
kind = "github_releases"
repo = "obsidianmd/obsidian-releases"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "obsidian-{version}.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian"
path = "obsidian"

[[artifacts.gui_apps]]
app_id = "md.obsidian.Obsidian"
display_name = "Obsidian"
exec = "obsidian"
categories = ["Office", "Utility"]

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "obsidian-{version}-arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian"
path = "obsidian"

[[artifacts.gui_apps]]
app_id = "md.obsidian.Obsidian"
display_name = "Obsidian"
exec = "obsidian"
categories = ["Office", "Utility"]

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "Obsidian-{version}.dmg"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian"
path = "Obsidian.app/Contents/MacOS/Obsidian"

[[artifacts.gui_apps]]
app_id = "md.obsidian.Obsidian"
display_name = "Obsidian"
exec = "Obsidian.app"
categories = ["Office", "Utility"]

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "Obsidian-{version}.dmg"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian"
path = "Obsidian.app/Contents/MacOS/Obsidian"

[[artifacts.gui_apps]]
app_id = "md.obsidian.Obsidian"
display_name = "Obsidian"
exec = "Obsidian.app"
categories = ["Office", "Utility"]

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "Obsidian-{version}.exe"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian"
path = "Obsidian-{version}.exe"

[[artifacts.gui_apps]]
app_id = "md.obsidian.Obsidian"
display_name = "Obsidian"
exec = "Obsidian-{version}.exe"
categories = ["Office", "Utility"]
