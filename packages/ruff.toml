name = "ruff"
license = "MIT"
homepage = "https://github.com/astral-sh/ruff"

[source.release]
kind = "github_releases"
repo = "astral-sh/ruff"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "ruff-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "ruff"
path = "ruff"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "ruff-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "ruff"
path = "ruff"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "ruff-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "ruff"
path = "ruff"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "ruff-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "ruff"
path = "ruff"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "ruff-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "ruff"
path = "ruff.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "ruff-aarch64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "ruff"
path = "ruff.exe"
