name = "gh"
license = "MIT"
homepage = "https://github.com/cli/cli"

[source.release]
kind = "github_releases"
repo = "cli/cli"
include_prereleases = false
tag_prefix = "v"

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "gh_{version}_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "gh_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "gh_{version}_macOS_amd64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "gh_{version}_macOS_arm64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "gh_{version}_windows_amd64.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "gh"
path = "bin/gh.exe"

[[integrations]]
kind = "man_page"
platforms = ["linux", "macos"]
section = "1"
source = "share/man/man1/*.1"
