name = "obsidian-cli"
license = "MIT"
homepage = "https://github.com/Yakitrak/notesmd-cli"

[source.release]
kind = "github_releases"
repo = "Yakitrak/notesmd-cli"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "notesmd-cli_{version}_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian-cli"
path = "notesmd-cli"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "notesmd-cli_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian-cli"
path = "notesmd-cli"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "notesmd-cli_{version}_darwin_all.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian-cli"
path = "notesmd-cli"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "notesmd-cli_{version}_darwin_all.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian-cli"
path = "notesmd-cli"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "notesmd-cli_{version}_windows_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian-cli"
path = "notesmd-cli.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "notesmd-cli_{version}_windows_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "obsidian-cli"
path = "notesmd-cli.exe"
