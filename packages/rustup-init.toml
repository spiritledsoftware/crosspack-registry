name = "rustup-init"
license = "MIT OR Apache-2.0"
homepage = "https://rustup.rs/"

[source.release]
kind = "text_endpoint"
url = "https://static.rust-lang.org/rustup/release-stable.toml"
version_regex = "^version\\s*=\\s*'([^']+)'"

[source.version]
kind = "semver_field"
field = "version"

[source.checksum]
kind = "url_sha256"
url_template = "{url}.sha256"

[source.asset]
kind = "templated"
base_url = "https://static.rust-lang.org/rustup/archive/{version}"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "{target}/rustup-init"
archive = "bin"

[[artifacts.binaries]]
name = "rustup-init"
path = "rustup-init-x86_64-unknown-linux-gnu"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "{target}/rustup-init"
archive = "bin"

[[artifacts.binaries]]
name = "rustup-init"
path = "rustup-init-aarch64-unknown-linux-gnu"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "{target}/rustup-init"
archive = "bin"

[[artifacts.binaries]]
name = "rustup-init"
path = "rustup-init-x86_64-apple-darwin"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "{target}/rustup-init"
archive = "bin"

[[artifacts.binaries]]
name = "rustup-init"
path = "rustup-init-aarch64-apple-darwin"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "{target}/rustup-init.exe"
archive = "bin"

[[artifacts.binaries]]
name = "rustup-init"
path = "rustup-init-x86_64-pc-windows-msvc.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "{target}/rustup-init.exe"
archive = "bin"

[[artifacts.binaries]]
name = "rustup-init"
path = "rustup-init-aarch64-pc-windows-msvc.exe"
