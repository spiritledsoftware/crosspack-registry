name = "fzf"
license = "MIT"
homepage = "https://github.com/junegunn/fzf"

[source]
provider = "github"
repo = "junegunn/fzf"
tag_prefix = "v"
include_prereleases = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "fzf-{version}-linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "fzf"
path = "fzf"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "fzf-{version}-linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "fzf"
path = "fzf"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "fzf-{version}-darwin_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "fzf"
path = "fzf"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "fzf-{version}-darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "fzf"
path = "fzf"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "fzf-{version}-windows_amd64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "fzf"
path = "fzf.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "fzf-{version}-windows_arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "fzf"
path = "fzf.exe"
