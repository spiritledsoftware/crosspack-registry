name = "kind"
license = "Apache-2.0"
homepage = "https://github.com/kubernetes-sigs/kind"

[source.release]
kind = "github_releases"
repo = "kubernetes-sigs/kind"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "kind-linux-amd64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "kind"
path = "kind"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "kind-linux-arm64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "kind"
path = "kind"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "kind-darwin-amd64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "kind"
path = "kind"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "kind-darwin-arm64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "kind"
path = "kind"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "kind-windows-amd64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "kind"
path = "kind.exe"
