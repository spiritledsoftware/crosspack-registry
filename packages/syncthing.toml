name = "syncthing"
license = "MPL-2.0"
homepage = "https://github.com/syncthing/syncthing"

[source.release]
kind = "github_releases"
repo = "syncthing/syncthing"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[integrations]]
kind = "service"
name = "syncthing"
source = "etc/linux-systemd/user/syncthing.service"
enable = false

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "syncthing-linux-amd64-v{version}.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "syncthing"
path = "syncthing"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "syncthing-linux-arm64-v{version}.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "syncthing"
path = "syncthing"
