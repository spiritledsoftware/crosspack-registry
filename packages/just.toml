name = "just"
license = "CC0-1.0"
homepage = "https://github.com/casey/just"

[source.release]
kind = "github_releases"
repo = "casey/just"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-musl"
asset = "just-{version}-x86_64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "just"
path = "just"

[[artifacts]]
target = "aarch64-unknown-linux-musl"
asset = "just-{version}-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "just"
path = "just"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "just-{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "just"
path = "just"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "just-{version}-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "just"
path = "just"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "just-{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "just"
path = "just.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "just-{version}-aarch64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "just"
path = "just.exe"
