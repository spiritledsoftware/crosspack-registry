name = "lsd"
license = "Apache-2.0"
homepage = "https://github.com/lsd-rs/lsd"

[source.release]
kind = "github_releases"
repo = "lsd-rs/lsd"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "lsd-v{version}-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "lsd"
path = "lsd"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "lsd-v{version}-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "lsd"
path = "lsd"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "lsd-v{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "lsd"
path = "lsd"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "lsd-v{version}-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "lsd"
path = "lsd"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "lsd-v{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "lsd"
path = "lsd.exe"
