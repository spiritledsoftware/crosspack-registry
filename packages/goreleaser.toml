name = "goreleaser"
license = "MIT"
homepage = "https://github.com/goreleaser/goreleaser"

[source.release]
kind = "github_releases"
repo = "goreleaser/goreleaser"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "goreleaser_Linux_x86_64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "goreleaser"
path = "goreleaser"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "goreleaser_Linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "goreleaser"
path = "goreleaser"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "goreleaser_Darwin_x86_64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "goreleaser"
path = "goreleaser"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "goreleaser_Darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "goreleaser"
path = "goreleaser"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "goreleaser_Windows_x86_64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "goreleaser"
path = "goreleaser.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "goreleaser_Windows_arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "goreleaser"
path = "goreleaser.exe"
