name = "dust"
license = "Apache-2.0"
homepage = "https://github.com/bootandy/dust"

[source.release]
kind = "github_releases"
repo = "bootandy/dust"
tag_prefix = "v"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "dust-v{version}-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "dust"
path = "dust"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "dust-v{version}-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "dust"
path = "dust"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "dust-v{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "dust"
path = "dust"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "dust-v{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "dust"
path = "dust.exe"
