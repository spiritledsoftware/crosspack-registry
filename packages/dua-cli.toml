name = "dua-cli"
license = "MIT"
homepage = "https://github.com/Byron/dua-cli"

[source.release]
kind = "github_releases"
repo = "Byron/dua-cli"
tag_prefix = "v"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-musl"
asset = "dua-v{version}-x86_64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "dua"
path = "dua"

[[artifacts]]
target = "aarch64-unknown-linux-musl"
asset = "dua-v{version}-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "dua"
path = "dua"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "dua-v{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "dua"
path = "dua"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "dua-v{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "dua"
path = "dua.exe"
