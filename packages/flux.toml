name = "flux"
license = "Apache-2.0"
homepage = "https://github.com/fluxcd/flux2"

[source.release]
kind = "github_releases"
repo = "fluxcd/flux2"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "flux_{version}_linux_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "flux"
path = "flux"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "flux_{version}_linux_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "flux"
path = "flux"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "flux_{version}_darwin_amd64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "flux"
path = "flux"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "flux_{version}_darwin_arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "flux"
path = "flux"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "flux_{version}_windows_amd64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "flux"
path = "flux.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "flux_{version}_windows_arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "flux"
path = "flux.exe"
