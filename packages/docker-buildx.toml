name = "docker-buildx"
license = "Apache-2.0"
homepage = "https://github.com/docker/buildx"

[source.release]
kind = "github_releases"
repo = "docker/buildx"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[integrations]]
kind = "docker_cli_plugin"
name = "buildx"
source = "artifact.bin"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "buildx-v{version}.linux-amd64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "docker-buildx"
path = "artifact.bin"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "buildx-v{version}.linux-arm64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "docker-buildx"
path = "artifact.bin"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "buildx-v{version}.darwin-amd64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "docker-buildx"
path = "artifact.bin"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "buildx-v{version}.darwin-arm64"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "docker-buildx"
path = "artifact.bin"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "buildx-v{version}.windows-amd64.exe"
archive = "bin"
strip_components = 0

[[artifacts.binaries]]
name = "docker-buildx"
path = "artifact.bin"
