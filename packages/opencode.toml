name = "opencode"
license = "MIT"
homepage = "https://github.com/sst/opencode"

[source.release]
kind = "github_releases"
repo = "sst/opencode"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "opencode-linux-x64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "opencode"
path = "opencode"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "opencode-linux-arm64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "opencode"
path = "opencode"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "opencode-darwin-x64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "opencode"
path = "opencode"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "opencode-darwin-arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "opencode"
path = "opencode"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "opencode-windows-x64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "opencode"
path = "opencode.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "opencode-windows-arm64.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "opencode"
path = "opencode.exe"
