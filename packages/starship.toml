name = "starship"
license = "ISC"
homepage = "https://github.com/starship/starship"

[[shell_init]]
name = "starship"
binary = "starship"
strategy = "eval_stdout"
bash = ["init", "bash"]
zsh = ["init", "zsh"]
fish = ["init", "fish"]
powershell = ["init", "powershell"]

[source.release]
kind = "github_releases"
repo = "starship/starship"
include_prereleases = false
tag_prefix = "v"

[source.version]
kind = "github_tag"

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "starship-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "aarch64-unknown-linux-musl"
asset = "starship-aarch64-unknown-linux-musl.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "starship-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "starship-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "starship-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "starship"
path = "starship.exe"
