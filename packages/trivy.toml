name = "trivy"
license = "Apache-2.0"
homepage = "https://github.com/aquasecurity/trivy"

[source.release]
kind = "github_releases"
repo = "aquasecurity/trivy"
tag_prefix = "v"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "trivy_{version}_Linux-64bit.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "trivy"
path = "trivy"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "trivy_{version}_Linux-ARM64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "trivy"
path = "trivy"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "trivy_{version}_macOS-64bit.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "trivy"
path = "trivy"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "trivy_{version}_macOS-ARM64.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "trivy"
path = "trivy"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "trivy_{version}_windows-64bit.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "trivy"
path = "trivy.exe"
