name = "bandwhich"
license = "MIT"
homepage = "https://github.com/imsnif/bandwhich"

[source.release]
kind = "github_releases"
repo = "imsnif/bandwhich"
tag_prefix = "v"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "bandwhich-v{version}-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "bandwhich"
path = "bandwhich"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "bandwhich-v{version}-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "bandwhich"
path = "bandwhich"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "bandwhich-v{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "bandwhich"
path = "bandwhich"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "bandwhich-v{version}-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 0

[[artifacts.binaries]]
name = "bandwhich"
path = "bandwhich"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "bandwhich-v{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 0

[[artifacts.binaries]]
name = "bandwhich"
path = "bandwhich.exe"
