name = "nushell"
license = "MIT"
homepage = "https://github.com/nushell/nushell"

[source.release]
kind = "github_releases"
repo = "nushell/nushell"
include_prereleases = false

[source.version]
kind = "github_tag"

[source.checksum]
kind = "asset_digest"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "nu-{version}-x86_64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "nu"
path = "nu"

[[artifacts]]
target = "aarch64-unknown-linux-gnu"
asset = "nu-{version}-aarch64-unknown-linux-gnu.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "nu"
path = "nu"

[[artifacts]]
target = "x86_64-apple-darwin"
asset = "nu-{version}-x86_64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "nu"
path = "nu"

[[artifacts]]
target = "aarch64-apple-darwin"
asset = "nu-{version}-aarch64-apple-darwin.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "nu"
path = "nu"

[[artifacts]]
target = "x86_64-pc-windows-msvc"
asset = "nu-{version}-x86_64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "nu"
path = "nu.exe"

[[artifacts]]
target = "aarch64-pc-windows-msvc"
asset = "nu-{version}-aarch64-pc-windows-msvc.zip"
archive = "zip"
strip_components = 1

[[artifacts.binaries]]
name = "nu"
path = "nu.exe"
