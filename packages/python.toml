name = "python"
license = "Python-2.0"
homepage = "https://github.com/astral-sh/python-build-standalone"

[source.release]
kind = "python_build_standalone"
repo = "astral-sh/python-build-standalone"
python_major_minor = "3.14"
include_prereleases = false

[source.checksum]
kind = "download_sha256"

[source.asset]
kind = "release_asset_url"

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
asset = "cpython-{version}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
archive = "tar.gz"
strip_components = 1

[[artifacts.binaries]]
name = "python"
path = "bin/python3"
[[artifacts.binaries]]
name = "python3"
path = "bin/python3"
[[artifacts.binaries]]
name = "python3.14"
path = "bin/python3.14"

